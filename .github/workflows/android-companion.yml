name: Android Companion Debug APK

on:
  push:
    paths:
      - "android/application-assist/**"
      - ".github/workflows/android-companion.yml"
  pull_request:
    paths:
      - "android/application-assist/**"
      - ".github/workflows/android-companion.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Hosted Ubuntu provides commandline-tools, but not always ANDROID_HOME
      # or sdkmanager on PATH. Avoid setup-android's retired 'tools' package.
      - name: Discover Android SDK and commandline tools
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$sdk_root/cmdline-tools"
          sdkmanager_path="$(find "$sdk_root/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$sdkmanager_path"
          test -x "$sdkmanager_path"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$(dirname "$sdkmanager_path")" >> "$GITHUB_PATH"
          "$sdkmanager_path" --version
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Compile and test companion debug APK
        working-directory: android/application-assist
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - name: Preserve debug-only APK for device testing
        uses: actions/upload-artifact@v4
        with:
          name: EscapeHatch-Android-Assist-debug-test-only
          path: android/application-assist/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
