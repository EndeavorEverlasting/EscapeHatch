name: Android Companion Debug APK

on:
  push:
    paths:
      - "android/application-assist/**"
      - ".github/workflows/android-companion.yml"
  pull_request:
    paths:
      - "android/application-assist/**"
      - ".github/workflows/android-companion.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # GitHub hosted Ubuntu already provides Android cmdline-tools; the old
      # setup-android action invokes the removed sdkmanager 'tools' package.
      - name: Validate hosted Android SDK
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?\"Hosted runner must provide Android SDK\"}"
          command -v sdkmanager
          sdkmanager --version
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Compile companion debug APK
        working-directory: android/application-assist
        run: gradle --no-daemon :app:assembleDebug
      - name: Preserve debug-only APK for device testing
        uses: actions/upload-artifact@v4
        with:
          name: EscapeHatch-Android-Assist-debug-test-only
          path: android/application-assist/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
