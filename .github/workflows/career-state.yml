name: Career State Validation

on:
  push:
    paths:
      - "contracts/**"
      - "fixtures/**"
      - "scripts/validate_career_state.py"
      - "scripts/validate_career_claim_fidelity.py"
      - "scripts/validate_career_artifact_propagation.py"
      - "harness/contracts/career-artifact-propagation.v1.json"
      - "docs/CAREER_ARTIFACT_PROPAGATION_HARNESS.md"
      - "harness/contracts/resume-selection-graph.v1.json"
      - "scripts/validate_resume_selection_graph.py"
      - "artifacts/escape-hatch/src/lib/resume-selection-graph.ts"
      - "artifacts/escape-hatch/src/lib/resume-selection-graph.test.ts"
      - "scripts/validate_application_companion.py"
      - "scripts/export_study_guidance.py"
      - "tests/test_study_guidance_export.py"
      - ".github/workflows/career-state.yml"
  pull_request:
    # Required by the promotion contract for every candidate to main.
    # A path filter can omit the exact-head check even when local validators pass.
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate resume selection graph contract
        run: python scripts/validate_resume_selection_graph.py
      - name: Test resume graph resolution and platform overwrite safety
        run: node --experimental-strip-types --test artifacts/escape-hatch/src/lib/resume-selection-graph.test.ts
      - name: Validate career-state graph
        run: python scripts/validate_career_state.py
      - name: Validate career claim fidelity
        run: python scripts/validate_career_claim_fidelity.py
      - name: Validate career artifact propagation
        run: python scripts/validate_career_artifact_propagation.py
      - name: Validate generated career reconciliation scaffold
        run: |
          python scripts/validate_career_artifact_propagation.py --scaffold reviewed_source --source-revision synthetic-r1 > /tmp/career-propagation.json
          python scripts/validate_career_artifact_propagation.py --input /tmp/career-propagation.json
      - name: Validate application companion
        run: python scripts/validate_application_companion.py
      - name: Test StudySyndicate export
        run: python tests/test_study_guidance_export.py
      - name: Compile product validators
        run: python -m py_compile scripts/validate_career_state.py scripts/validate_career_claim_fidelity.py scripts/validate_career_artifact_propagation.py scripts/validate_application_companion.py scripts/export_study_guidance.py tests/test_study_guidance_export.py
      - name: Check whitespace
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            git diff --check "$base"...HEAD
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff --check
          fi
