name: Career State Validation

on:
  push:
    paths:
      - "contracts/**"
      - "fixtures/**"
      - "scripts/validate_career_state.py"
      - "scripts/export_study_guidance.py"
      - "tests/test_study_guidance_export.py"
      - ".github/workflows/career-state.yml"
  pull_request:
    paths:
      - "contracts/**"
      - "fixtures/**"
      - "scripts/validate_career_state.py"
      - "scripts/export_study_guidance.py"
      - "tests/test_study_guidance_export.py"
      - ".github/workflows/career-state.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate career-state graph
        run: python scripts/validate_career_state.py
      - name: Test StudySyndicate export
        run: python tests/test_study_guidance_export.py
      - name: Compile product validators
        run: python -m py_compile scripts/validate_career_state.py scripts/export_study_guidance.py tests/test_study_guidance_export.py
      - name: Check whitespace
        run: git diff --check origin/${{ github.base_ref || 'main' }}...HEAD
