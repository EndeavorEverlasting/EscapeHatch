name: Windows preview package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/test_windows_preview_package.py
      - run: python scripts/package_windows_preview.py --output-root "${{ runner.temp }}/windows-preview"
      - uses: actions/upload-artifact@v4
        with:
          name: EscapeHatch-unsigned-Windows-preview-${{ github.sha }}
          path: ${{ runner.temp }}/windows-preview/*
          if-no-files-found: error
