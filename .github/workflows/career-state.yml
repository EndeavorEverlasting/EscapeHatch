name: Career State Validation

on:
  push:
    paths:
      - "contracts/**"
      - "fixtures/**"
      - "scripts/validate_career_state.py"
      - "scripts/validate_application_companion.py"
      - "scripts/export_study_guidance.py"
      - "tests/test_study_guidance_export.py"
      - ".github/workflows/career-state.yml"
  pull_request:
    paths:
      - "contracts/**"
      - "fixtures/**"
      - "scripts/validate_career_state.py"
      - "scripts/validate_application_companion.py"
      - "scripts/export_study_guidance.py"
      - "tests/test_study_guidance_export.py"
      - ".github/workflows/career-state.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate career-state graph
        run: python scripts/validate_career_state.py
      - name: Validate application companion
        run: python scripts/validate_application_companion.py
      - name: Test StudySyndicate export
        run: python tests/test_study_guidance_export.py
      - name: Compile product validators
        run: python -m py_compile scripts/validate_career_state.py scripts/validate_application_companion.py scripts/export_study_guidance.py tests/test_study_guidance_export.py
      - name: Check whitespace
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            git diff --check "$base"...HEAD
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff --check
          fi
