name: Application Assist Session Validation

on:
  push:
    paths:
      - "browser/application-assist/**"
      - "contracts/application-assist-session.v1.json"
      - "contracts/application-assist-modality.v1.json"
      - "contracts/application-event-journal.v1.json"
      - "harness/contracts/evidence-authority-crossrepo.v1.json"
      - "docs/CROSS_REPO_EVIDENCE_CONTRIBUTION_20261013.md"
      - "docs/APPLICATION_ASSIST_SESSION.md"
      - "docs/APPLICATION_EVENT_JOURNAL.md"
      - "tests/test_application_assist_session_contract.py"
      - "tests/test_application_assist_session.mjs"
      - "tests/test_application_assist_modality_contract.py"
      - "tests/test_application_assist_modality.mjs"
      - "tests/test_application_event_journal.mjs"
      - "tests/test_application_event_observer.mjs"
      - "tests/test_application_event_evidence_review.mjs"
      - "tests/test_application_event_journal_contract.py"
      - "artifacts/escape-hatch/tests/event-journal.spec.ts"
      - "artifacts/escape-hatch/tests/assist.spec.ts"
      - ".github/workflows/application-assist.yml"
  pull_request:
    paths:
      - "browser/application-assist/**"
      - "contracts/application-assist-session.v1.json"
      - "contracts/application-assist-modality.v1.json"
      - "docs/APPLICATION_ASSIST_SESSION.md"
      - "docs/APPLICATION_EVENT_JOURNAL.md"
      - "tests/test_application_assist_session_contract.py"
      - "tests/test_application_assist_session.mjs"
      - "tests/test_application_assist_modality_contract.py"
      - "tests/test_application_assist_modality.mjs"
      - "contracts/application-event-journal.v1.json"
      - "tests/test_application_event_journal_contract.py"
      - "tests/test_application_event_journal.mjs"
      - "tests/test_application_event_observer.mjs"
      - "tests/test_application_event_evidence_review.mjs"
      - "artifacts/escape-hatch/tests/event-journal.spec.ts"
      - "artifacts/escape-hatch/tests/assist.spec.ts"
      - ".github/workflows/application-assist.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate assist session contract and extension safety
        run: python tests/test_application_assist_session_contract.py
      - name: Validate assist modality contract
        run: python tests/test_application_assist_modality_contract.py
      - name: Test Fill Plan, policy gate, stop, and undo runtime
        run: node tests/test_application_assist_session.mjs
      - name: Test three-mode modality harness
        run: node tests/test_application_assist_modality.mjs
      - name: Validate private event journal contract and reducer
        run: |
          python tests/test_application_event_journal_contract.py
          node tests/test_application_event_journal.mjs
          node tests/test_application_event_observer.mjs
          node tests/test_application_event_evidence_review.mjs
      - name: Parse popup and modality runtime
        run: |
          node --check browser/application-assist/modality.js
          node --check browser/application-assist/popup.js
          node --check browser/application-assist/event-journal.js
          node --check browser/application-assist/event-evidence-review.js
          node --check browser/application-assist/event-observer.js
      - name: Validate JSON syntax
        run: |
          python -m json.tool contracts/application-assist-session.v1.json > /dev/null
          python -m json.tool contracts/application-event-journal.v1.json > /dev/null
          python -m json.tool harness/contracts/evidence-authority-crossrepo.v1.json > /dev/null
          python -m json.tool contracts/application-assist-modality.v1.json > /dev/null
          python -m json.tool browser/application-assist/manifest.json > /dev/null
      - name: Check whitespace
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            git diff --check "$base"...HEAD
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff --check
          fi

  synthetic-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --prefix artifacts/escape-hatch --ignore-scripts --package-lock=false
      - run: npx --prefix artifacts/escape-hatch playwright install --with-deps chromium
      - name: Headed synthetic listener acceptance (not live ATS proof)
        run: xvfb-run --auto-servernum npm --prefix artifacts/escape-hatch run test:browser -- event-journal.spec.ts
