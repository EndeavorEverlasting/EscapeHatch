name: Application Autofill Validation

on:
  push:
    paths:
      - "browser/application-autofill/**"
      - "contracts/application-autofill.v1.json"
      - "docs/APPLICATION_AUTOFILL.md"
      - "tests/test_application_autofill_contract.py"
      - "tests/test_application_autofill.mjs"
      - ".github/workflows/application-autofill.yml"
  pull_request:
    paths:
      - "browser/application-autofill/**"
      - "contracts/application-autofill.v1.json"
      - "docs/APPLICATION_AUTOFILL.md"
      - "tests/test_application_autofill_contract.py"
      - "tests/test_application_autofill.mjs"
      - ".github/workflows/application-autofill.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate autofill contract and extension safety
        run: python tests/test_application_autofill_contract.py
      - name: Test WCG-style field matching and no-submit runtime
        run: node tests/test_application_autofill.mjs
      - name: Validate JSON syntax
        run: |
          python -m json.tool contracts/application-autofill.v1.json > /dev/null
          python -m json.tool browser/application-autofill/manifest.json > /dev/null
      - name: Check whitespace
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            git diff --check "$base"...HEAD
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff --check
          fi
