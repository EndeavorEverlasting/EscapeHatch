name: Deterministic Application Autopilot Core
on:
  pull_request:
    paths:
      - 'artifacts/escape-hatch/application-autopilot-executor.ts'
      - 'artifacts/escape-hatch/application-autopilot-executor.test.ts'
      - 'artifacts/escape-hatch/tests/application-autopilot-executor.spec.ts'
      - 'artifacts/escape-hatch/application-navigation-policy.ts'
      - 'artifacts/escape-hatch/managed-preparation-driver.ts'
      - 'artifacts/escape-hatch/managed-preparation-driver.test.ts'
      - 'artifacts/escape-hatch/browser-assist-control.ts'
      - 'contracts/managed-browser-progression.v1.json'
      - '.github/workflows/application-autopilot-executor.yml'
  push:
    paths:
      - 'artifacts/escape-hatch/application-autopilot-executor.ts'
      - 'artifacts/escape-hatch/application-autopilot-executor.test.ts'
      - 'artifacts/escape-hatch/tests/application-autopilot-executor.spec.ts'
      - 'artifacts/escape-hatch/application-navigation-policy.ts'
      - 'artifacts/escape-hatch/managed-preparation-driver.ts'
      - 'artifacts/escape-hatch/managed-preparation-driver.test.ts'
      - 'artifacts/escape-hatch/browser-assist-control.ts'
      - 'contracts/managed-browser-progression.v1.json'
      - '.github/workflows/application-autopilot-executor.yml'
permissions:
  contents: read
jobs:
  deterministic-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Consequence classifier and deterministic cycle (no AI, no live ATS)
        run: node --experimental-strip-types --test artifacts/escape-hatch/application-navigation-policy.test.ts artifacts/escape-hatch/application-autopilot-executor.test.ts artifacts/escape-hatch/managed-preparation-driver.test.ts
      - name: Install cockpit dependencies and Chromium for synthetic real-browser proof
        working-directory: artifacts/escape-hatch
        run: |
          npm install --no-audit --no-fund
          npx playwright install chromium
      - name: Managed assist policy parsers after Playwright deps are available
        working-directory: artifacts/escape-hatch
        run: node --experimental-strip-types --test browser-assist-control.test.ts
      - name: Chromium synthetic ATS prepare-through-review; terminal effect journal must stay empty
        working-directory: artifacts/escape-hatch
        run: npx playwright test tests/application-autopilot-executor.spec.ts
      - name: Parent completion floor stays fail-closed
        run: python scripts/validate_application_autofill_parent.py
      - name: Repository harness
        run: python scripts/validate_harness.py
      - name: Patch hygiene
        run: git diff --check HEAD^ HEAD
