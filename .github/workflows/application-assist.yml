name: Application Assist Session Validation

on:
  workflow_dispatch:
  push:
    paths:
      - "browser/application-assist/**"
      - "android/application-assist/**"
      - "tests/test_android_privacy_preference_contract.py"
      - "scripts/package_application_assist.py"
      - "tests/test_application_assist_package.py"
      - "artifacts/escape-hatch/*native*"
      - "artifacts/escape-hatch/extension-profile-host*"
      - "scripts/windows/EscapeHatch-NativeHost.ps1"
      - "tests/test_native*"
      - "contracts/application-assist-session.v1.json"
      - "contracts/application-assist-modality.v1.json"
      - "docs/APPLICATION_ASSIST_SESSION.md"
      - "tests/test_application_assist_session_contract.py"
      - "tests/test_application_assist_session.mjs"
      - "tests/test_application_assist_modality_contract.py"
      - "tests/test_application_assist_modality.mjs"
      - ".github/workflows/application-assist.yml"
  pull_request:
    paths:
      - "browser/application-assist/**"
      - "android/application-assist/**"
      - "tests/test_android_privacy_preference_contract.py"
      - "scripts/package_application_assist.py"
      - "tests/test_application_assist_package.py"
      - "artifacts/escape-hatch/*native*"
      - "artifacts/escape-hatch/extension-profile-host*"
      - "scripts/windows/EscapeHatch-NativeHost.ps1"
      - "tests/test_native*"
      - "contracts/application-assist-session.v1.json"
      - "contracts/application-assist-modality.v1.json"
      - "docs/APPLICATION_ASSIST_SESSION.md"
      - "tests/test_application_assist_session_contract.py"
      - "tests/test_application_assist_session.mjs"
      - "tests/test_application_assist_modality_contract.py"
      - "tests/test_application_assist_modality.mjs"
      - ".github/workflows/application-assist.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test immutable packaging and enrollment boundaries
        run: python tests/test_application_assist_package.py
      - name: Build and verify Chrome Web Store upload candidate
        run: |
          python scripts/package_application_assist.py --store-zip --enrollment
          python scripts/package_application_assist.py --store-zip --verify
      - name: Preserve extension upload candidate and provenance
        uses: actions/upload-artifact@v4
        with:
          name: application-assist-${{ github.sha }}
          path: |
            Outputs/application-assist/*.zip
            Outputs/application-assist/*.zip.release.json
          if-no-files-found: error
      - name: Validate Android privacy preference bootstrap boundary
        run: python tests/test_android_privacy_preference_contract.py
      - name: Validate assist session contract and extension safety
        run: python tests/test_application_assist_session_contract.py
      - name: Validate assist modality contract
        run: python tests/test_application_assist_modality_contract.py
      - name: Test Fill Plan, policy gate, stop, and undo runtime
        run: node tests/test_application_assist_session.mjs
      - name: Test three-mode modality harness
        run: node tests/test_application_assist_modality.mjs
      - name: Preserve submission observer behavior with coexisting native listeners
        run: node tests/test_application_operator_submit.mjs
      - name: Test native projection policy and worker boundaries
        run: node tests/test_native_profile_bridge.mjs
      - name: Parse popup and modality runtime
        run: |
          node --check browser/application-assist/modality.js
          node --check browser/application-assist/popup.js
      - name: Validate JSON syntax
        run: |
          python -m json.tool contracts/application-assist-session.v1.json > /dev/null
          python -m json.tool contracts/application-assist-modality.v1.json > /dev/null
          python -m json.tool browser/application-assist/manifest.json > /dev/null
      - name: Check whitespace
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            git diff --check "$base"...HEAD
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff --check
          fi

  native-profile-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare app dependencies without changing source manifests
        working-directory: artifacts/escape-hatch
        run: npm install --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Reject dependency preparation source mutation
        run: git diff --exit-code -- artifacts/escape-hatch/package.json
      - working-directory: artifacts/escape-hatch
        run: npx playwright install chromium
      - name: Verify native source admission and framed transport
        run: npm --prefix artifacts/escape-hatch run test:native-profile
      - name: Verify dependency lifecycle selection and source preservation
        run: python tests/test_escapehatch_installer_source_delivery.py
      - name: Verify registration ownership and preservation
        run: python tests/test_native_host_registration.py
      - name: Observe native hydration inside Chrome and isolated browser profiles
        run: npm --prefix artifacts/escape-hatch run test:native-profile:browser

  android-companion-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 17 for Android Gradle Plugin
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK without removed legacy tools package
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Set up supported Gradle version
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compile Android companion from canonical VERSION
        run: gradle --no-daemon --project-dir android/application-assist :app:assembleDebug
      - name: Keep a synthetic debug-build receipt
        uses: actions/upload-artifact@v4
        with:
          name: android-companion-debug-${{ github.sha }}
          path: android/application-assist/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
