name: Harness Validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate governance
        run: python scripts/validate_governance.py

      - name: Validate product version
        run: python scripts/validate_product_version.py

      - name: Test product version
        run: python tests/test_product_version.py

      - name: Validate application harness
        run: python scripts/validate_application_harness.py

      - name: Validate application companion
        run: python scripts/validate_application_companion.py

      - name: Validate resume presentation
        run: python scripts/validate_resume_presentation.py

      - name: Validate harness
        run: python scripts/validate_harness.py

      - name: Validate career-state contract
        run: python scripts/validate_career_state.py

      - name: Test Study Syndicate export
        run: python tests/test_study_guidance_export.py

      - name: Compile harness validators
        run: python -m py_compile scripts/validate_governance.py scripts/validate_product_version.py scripts/product_version.py scripts/validate_application_harness.py scripts/validate_application_companion.py scripts/validate_resume_presentation.py scripts/validate_harness.py scripts/validate_career_state.py scripts/export_study_guidance.py tests/test_product_version.py tests/test_study_guidance_export.py

      - name: Check whitespace
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            git diff --check "$base"...HEAD
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff --check
          fi

  windows-location:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate durable Windows repo root
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = Join-Path $HOME 'Desktop\Dev'
          New-Item -ItemType Directory -Path $expected -Force | Out-Null
          $actual = & ./scripts/resolve_repo.ps1 -ResolveOnly
          if ([IO.Path]::GetFullPath($actual) -ne [IO.Path]::GetFullPath($expected)) {
            throw "Expected durable dev root $expected, got $actual"
          }
          Write-Host "WINDOWS_REPO_ROOT=PASS"
          Write-Host "DEV_ROOT=$actual"
